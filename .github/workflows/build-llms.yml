name: Rebuild llms-full.txt

# llms-full.txt is generated from compendium/*.md. Whenever a source file
# changes, rebuild it and commit the result, so the file the website serves
# to AI systems can never drift out of sync with the source.

on:
  push:
    branches: [main]
    paths:
      - 'compendium/**.md'
      - 'build/build-llms-full.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild llms-full.txt
        run: python3 build/build-llms-full.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change - llms-full.txt was already up to date."
          else
            git add -A
            git commit -m "Rebuild llms-full.txt from compendium sources [skip ci]"
            git push
          fi
